[project]
name = "freesight"
version = "0.1.0"
description = "免费竞品调研 SDK:聚合 25 个免费免 key 公开数据源,支持统一/语义搜索与 agent 工具封装"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "h2>=4.4.1",
    "httpx>=0.28.1",
    "vortezwohl>=0.1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["freesignt"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["freesignt"]

