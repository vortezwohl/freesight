[project]
name = "freesight"
version = "0.4.0"
description = "75 free, keyless data sources. One polite Python client. Rate limits, 429 cooldowns, TTL cache and single-flight — handled."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ddgs>=9.16.0",
    "h2>=4.4.1",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["freesignt"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["freesignt"]
