[project]
name = "freesight"
version = "0.4.0"
description = "免费竞品调研多渠道数据访问 SDK:封装 75 个免费免 key 公开数据源,单渠道薄访问封装(按 host 自适应限流/429 冷却/TTL 缓存/单飞合并),跨源聚合与筛选交给调用方"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ddgs>=9.16.0",
    "h2>=4.4.1",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["freesignt"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["freesignt"]

